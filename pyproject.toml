[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goorouter"
version = "0.1.0"
description = "Localhost OpenAI-compatible router that picks between cloud and local LLMs per request."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rick Mellor" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.55",
    "httpx>=0.27",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
goorouter = "goorouter.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["goorouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
