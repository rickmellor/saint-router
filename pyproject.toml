[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saint-router"
version = "0.1.0"
description = "Localhost OpenAI-compatible router that picks between cloud and local LLMs per request."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rick Mellor" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.55",
    "httpx>=0.27",
    "typer>=0.12",
    "numpy>=1.26",  # embedding-classifier head (saint/embed_classifier.py)
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.34",   # AWS credential chain for provider = "bedrock" backends
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "boto3>=1.34",   # bedrock_auth tests
]

[project.scripts]
saint = "saint.cli:app"

# Distribution is `saint-router`, import package is `saint` — names differ, so the
# wheel target must be explicit (hatchling can't auto-detect it).
[tool.hatch.build.targets.wheel]
packages = ["saint"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer idiomatically uses function-call defaults like `typer.Option(...)` and
# `typer.Argument(...)`; B008 is a false positive here.
"saint/cli.py" = ["B008"]
# Test files: lazy local imports inside test bodies are intentional (fixture
# isolation, avoiding heavyweight imports during collection); inline test
# scaffolding sometimes uses `;` for compactness.
"tests/*" = ["E402", "E702"]

[tool.mypy]
# Pragmatic strictness: catch real type bugs but don't require exhaustive
# annotations on FastAPI/typer route handlers and inner closures (where
# the framework dictates the signature anyway).
python_version = "3.11"
files = ["saint"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# Permit untyped def signatures on framework-callbacks; type the bodies.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
