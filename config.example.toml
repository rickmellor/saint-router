# goorouter configuration. Copy to ~/.goorouter/config.toml and edit.

[server]
host = "127.0.0.1"
port = 4000

# ---- Backends ----------------------------------------------------------
# Names are arbitrary identifiers. `aliases` give short names you can use
# as !-prefixes (e.g. "!opus") in the latest user message.
# API keys: prefer `api_key_env` (read from the named environment variable);
# `api_key` is allowed but warned for non-LM-Studio providers.

[backends.cloud-large]
provider     = "anthropic"
model        = "claude-opus-4-7"
api_key_env  = "ANTHROPIC_API_KEY"
aliases      = ["opus", "claude"]
timeout_s    = 120

[backends.cloud-small]
provider     = "anthropic"
model        = "claude-haiku-4-5-20251001"
api_key_env  = "ANTHROPIC_API_KEY"
aliases      = ["haiku"]
timeout_s    = 60

[backends.local-large]
provider     = "openai"
base_url     = "http://localhost:1234/v1"
model        = "qwen2.5-32b-instruct"
api_key      = "lm-studio"
aliases      = ["qwen32"]
timeout_s    = 180

[backends.local-small]
provider     = "openai"
base_url     = "http://localhost:1234/v1"
model        = "qwen2.5-3b-instruct"
api_key      = "lm-studio"
aliases      = ["qwen3"]
timeout_s    = 60

[backends.local-coder]
provider     = "openai"
base_url     = "http://localhost:1234/v1"     # static baseline — used when johnny is absent/down
model        = "qwen2.5-coder-32b-instruct"
api_key      = "lm-studio"
aliases      = ["qwen-coder", "coder"]
timeout_s    = 180
# Optional johnny binding: when [johnny] is enabled and the 'coder' seat resolves
# `ready`, johnny's live endpoint/model OVERRIDE the static base_url/model above.
# Otherwise this backend falls back to its own static config (the override only ever
# improves on the baseline). Use johnny_seat = "<seat>" to bind a specific seat.
johnny_role  = "coder"
# while_loading = "cloud-small"               # per-backend warm-up target (else [routing].while_loading)

# ---- Classifier --------------------------------------------------------
[classifier]
backend          = "local-small"      # which backend runs the classifier
fallback_backend = "local-large"      # used for oversize input or primary failure (optional)
max_input_chars  = 8000               # primary's input cap (head-truncate if no fallback)
timeout_s        = 5
# prompt_template_path = "~/.goorouter/classifier.prompt"   # optional override

# ---- Routing -----------------------------------------------------------
[routing]
default_urgency    = "normal"
default_on_failure = "cloud-large"    # last-resort backend if classifier and fallback both fail.
                                      # Set to a local backend if running offline-only.
while_loading      = "cloud-small"    # serve here while a johnny-bound seat warms up (a *normal*
                                      # state on a reaped box — distinct from default_on_failure).

[routing.policy.normal]
"code,trivial"    = "local-coder"
"code,medium"     = "local-coder"
"code,hard"       = "cloud-large"
"general,trivial" = "local-small"
"general,medium"  = "local-large"
"general,hard"    = "cloud-large"

[routing.policy.urgent]
"code,trivial"    = "local-coder"
"code,medium"     = "cloud-small"
"code,hard"       = "cloud-large"
"general,trivial" = "cloud-small"
"general,medium"  = "cloud-small"
"general,hard"    = "cloud-large"

[routing.policy.patient]
"code,trivial"    = "local-coder"
"code,medium"     = "local-coder"
"code,hard"       = "local-large"
"general,trivial" = "local-small"
"general,medium"  = "local-small"
"general,hard"    = "local-large"

# ---- johnny integration (optional) -------------------------------------
# Present iff any backend has a johnny binding (johnny_role/johnny_seat). johnny is a
# local-inference manager that owns model lifecycle + liveness; SAINT asks it where a
# role is and whether it's ready, and (optionally) triggers a non-blocking load.
# SAINT stays fully functional with johnny absent — bound backends use their static config.
[johnny]
transport           = "cli"        # "cli" (shell out to `johnny`) | "http" (johnnyd)
cli_path            = "johnny"      # CLI transport: the johnny executable
# base_url          = "http://127.0.0.1:8080"   # HTTP transport: johnnyd base url
resolve_cache_ttl_s = 1.0           # cache resolve() results this long (hot path)
ensure_load         = true          # may SAINT trigger loads, or only observe + fall back?

# ---- Logging -----------------------------------------------------------
[logging]
db_path        = "~/.goorouter/log.sqlite"
prompt_storage = "full"   # "full" | "hashed" | "none"
                          # full:   readable later; useful for relabeling and future training
                          # hashed: SHA-256 only; deduplication possible without retaining content
                          # none:   metadata only (latency, tokens, decisions)
